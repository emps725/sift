<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Notes Search</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main class="shell">
    <header class="masthead">
      <p class="kicker">LOCAL INDEX / FIELD NOTES</p>
      <h1>Find the useful<br><em>thread.</em></h1>
      <p class="intro">Search your local document collection with title-aware ranking and exact phrase matching.</p>
    </header>

    <section class="search-panel" aria-label="Search documents">
      <form id="search-form">
        <label for="query">Search the index</label>
        <div class="search-row">
          <input id="query" name="q" type="search" placeholder="Try: inverted index or &quot;exact phrase&quot;"
            autocomplete="off" autofocus>
          <button type="submit">Search <span aria-hidden="true">↗</span></button>
        </div>
      </form>
      <p class="hint">Press <kbd>Enter</kbd> to search · Put quotes around an exact phrase</p>
    </section>

    <section class="results-section" aria-live="polite">
      <div class="results-heading">
        <h2 id="result-label">Ready when you are</h2>
        <span id="result-count"></span>
      </div>
      <div id="results" class="results-list">
        <div class="empty-state"><span class="empty-mark">+</span>
          <p>Your local index is waiting.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>

</html>
